<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Videos Cloudinary - DOPMAX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 { color: #fff; text-align: center; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #aaa; text-align: center; margin-bottom: 30px; font-size: 14px; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f4c542 0%, #f4a642 100%);
            color: #1a1a2e;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(244, 197, 66, 0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .message.success { background: rgba(76, 175, 80, 0.2); border: 1px solid #4caf50; color: #81c784; }
        .message.error { background: rgba(244, 67, 54, 0.2); border: 1px solid #f44336; color: #e57373; }
        .message.info { background: rgba(33, 150, 243, 0.2); border: 1px solid #2196f3; color: #64b5f6; }
        .hidden { display: none; }
        .video-list {
            max-height: 400px;
            overflow-y: auto;
            margin: 20px 0;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 10px;
        }
        .video-item {
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .video-item.success { border-left: 3px solid #4caf50; }
        .video-item.error { border-left: 3px solid #f44336; }
        .video-item.pending { border-left: 3px solid #ff9800; }
        .video-icon { font-size: 20px; }
        .video-info { flex: 1; color: #fff; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .video-status { font-size: 12px; color: #aaa; }
        .back-link { display: block; text-align: center; color: #aaa; margin-top: 20px; text-decoration: none; }
        .back-link:hover { color: #f4c542; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #fff; margin-bottom: 8px; font-weight: 500; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #f4c542; }
        input::placeholder { color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📹 Registrar Videos Cloudinary</h1>
        <p class="subtitle">18 videos encontrados</p>

        <div class="form-group">
            <label>Usuario (quien sube los videos)</label>
            <input type="text" id="username" placeholder="Tu nombre de usuario" value="admin">
        </div>

        <div id="message" class="message hidden"></div>

        <button class="btn" id="register-btn" onclick="registerVideos()">📹 Registrar Todos los Videos</button>
        <button class="btn" id="test-btn" onclick="testConnection()" style="background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);">🔍 Probar Conexión API</button>

        <div id="video-list" class="video-list hidden"></div>

        <a href="index.html" class="back-link">← Volver a DOPMAX</a>
    </div>

    <script>
        const API_BASE = '/api';
        
        // Lista completa de videos de Cloudinary
        const videos = [
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824491/Download_1_npvpfo.mp4', title: 'Download 1' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824488/13%C2%BA112_xpn677.mp4', title: '13º112' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824486/Download_6_t0h1xv.mp4', title: 'Download 6' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824486/Download_5_tefkxd.mp4', title: 'Download 5' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824486/Download_2_uvswgp.mp4', title: 'Download 2' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824486/Download_4_e40d6m.mp4', title: 'Download 4' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824485/Download_3_cvttsl.mp4', title: 'Download 3' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824484/314141_wcbfxt.mp4', title: '314141' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824484/12313131_iwv3zt.mp4', title: '12313131' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824483/521515_tmhf6o.mp4', title: '521515' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824484/151516162172172_y8qnkj.mp4', title: '151516162172172' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824484/africa_qqp1hm.mp4', title: 'Africa' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824484/151511616_lct0si.mp4', title: '151511616' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824482/Download_ks1gec.mp4', title: 'Download' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824482/525_qtomhc.mp4', title: '525' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824481/211_cowcom.mp4', title: '211' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824481/Download_7_nynrna.mp4', title: 'Download 7' },
            { url: 'https://res.cloudinary.com/dr5llopu0/video/upload/v1773824478/13%C2%BA112_dveosy.mp4', title: '13º112 (2)' }
        ];

        async function testConnection() {
            const messageEl = document.getElementById('message');
            try {
                const response = await fetch(`${API_BASE}/videos`);
                const data = await response.json();
                
                if (response.ok) {
                    messageEl.className = 'message success';
                    messageEl.textContent = `✅ Conexión exitosa! ${data.videos ? data.videos.length : 0} videos en BD`;
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = `❌ Error: ${data.error || 'Error desconocido'}`;
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = `❌ Error de conexión: ${error.message}`;
            }
            messageEl.classList.remove('hidden');
        }

        async function registerVideos() {
            const username = document.getElementById('username').value.trim() || 'admin';
            const messageEl = document.getElementById('message');
            const listEl = document.getElementById('video-list');
            const btn = document.getElementById('register-btn');
            
            if (!username) {
                messageEl.className = 'message error';
                messageEl.textContent = '❌ Ingresa un nombre de usuario';
                messageEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            listEl.classList.remove('hidden');
            listEl.innerHTML = '';

            let successCount = 0;
            let errorCount = 0;

            // Mostrar lista inicial
            videos.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'video-item pending';
                item.id = `video-${index}`;
                item.innerHTML = `
                    <span class="video-icon">⏳</span>
                    <span class="video-info">${video.title}</span>
                    <span class="video-status">Pendiente</span>
                `;
                listEl.appendChild(item);
            });

            // Registrar cada video
            for (let i = 0; i < videos.length; i++) {
                const video = videos[i];
                const itemEl = document.getElementById(`video-${i}`);
                
                try {
                    const response = await fetch(`${API_BASE}/videos/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            videoUrl: video.url,
                            usuario: username,
                            titulo: video.title
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        successCount++;
                        itemEl.className = 'video-item success';
                        itemEl.innerHTML = `
                            <span class="video-icon">✅</span>
                            <span class="video-info">${video.title}</span>
                            <span class="video-status">Registrado</span>
                        `;
                        console.log(`✅ Video registrado: ${video.title}`);
                    } else {
                        errorCount++;
                        itemEl.className = 'video-item error';
                        itemEl.innerHTML = `
                            <span class="video-icon">❌</span>
                            <span class="video-info">${video.title}</span>
                            <span class="video-status">${data.error || 'Error'}</span>
                        `;
                        console.error(`❌ Error registrando ${video.title}:`, data.error);
                    }
                } catch (error) {
                    errorCount++;
                    itemEl.className = 'video-item error';
                    itemEl.innerHTML = `
                        <span class="video-icon">❌</span>
                        <span class="video-info">${video.title}</span>
                        <span class="video-status">${error.message}</span>
                    `;
                    console.error(`❌ Error registrando ${video.title}:`, error);
                }

                // Scroll al final
                listEl.scrollTop = listEl.scrollHeight;
            }

            // Resultado final
            btn.disabled = false;
            
            if (successCount === videos.length) {
                messageEl.className = 'message success';
                messageEl.textContent = `✅ ¡Todos los ${successCount} videos registrados correctamente!`;
            } else {
                messageEl.className = 'message info';
                messageEl.textContent = `📊 Resultado: ${successCount} exitosos, ${errorCount} errores de ${videos.length} total`;
            }
        }
    </script>
</body>
</html>
