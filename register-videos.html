<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Videos - DOPMAX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #aaa;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #f4c542;
        }

        input::placeholder, textarea::placeholder {
            color: #888;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f4c542 0%, #f4a642 100%);
            color: #1a1a2e;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(244, 197, 66, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #81c784;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #e57373;
        }

        .hidden {
            display: none;
        }

        .info-box {
            background: rgba(244, 197, 66, 0.1);
            border: 1px solid rgba(244, 197, 66, 0.3);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .info-box h3 {
            color: #f4c542;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .info-box ul {
            color: #ccc;
            padding-left: 20px;
            font-size: 14px;
        }

        .info-box li {
            margin-bottom: 8px;
        }

        .info-box a {
            color: #f4c542;
            text-decoration: none;
        }

        .info-box a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            color: #aaa;
            margin-top: 20px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #f4c542;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📹 Registrar Videos</h1>
        <p class="subtitle">Sube videos a Cloudinary y regístralos aquí</p>

        <div class="info-box">
            <h3>📋 Instrucciones:</h3>
            <ul>
                <li>Crea cuenta gratis en <a href="https://cloudinary.com" target="_blank">Cloudinary.com</a></li>
                <li>Sube tus videos a Cloudinary (25GB gratis)</li>
                <li>Copia la URL de cada video</li>
                <li>Pega las URLs aquí con su título</li>
            </ul>
        </div>

        <div id="message" class="message hidden"></div>

        <form id="register-form">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="username" placeholder="Tu nombre de usuario" required>
            </div>

            <div class="form-group">
                <label>URLs de Videos (una por línea)</label>
                <textarea id="video-urls" placeholder="https://res.cloudinary.com/tu-cloud/video/upload/video1.mp4&#10;https://res.cloudinary.com/tu-cloud/video/upload/video2.mp4" required></textarea>
            </div>

            <div class="form-group">
                <label>Títulos (uno por línea, en el mismo orden)</label>
                <textarea id="video-titles" placeholder="Mi Video 1&#10;Mi Video 2"></textarea>
            </div>

            <button type="submit" class="btn" id="submit-btn">Registrar Videos</button>
        </form>

        <a href="index.html" class="back-link">← Volver a DOPMAX</a>
    </div>

    <script>
        const API_BASE = '/api';
        
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const urlsText = document.getElementById('video-urls').value.trim();
            const titlesText = document.getElementById('video-titles').value.trim();
            
            const messageEl = document.getElementById('message');
            const submitBtn = document.getElementById('submit-btn');
            
            // Procesar URLs y títulos
            const urls = urlsText.split('\n').map(url => url.trim()).filter(url => url);
            const titles = titlesText.split('\n').map(title => title.trim()).filter(title => title);
            
            if (urls.length === 0) {
                showMessage('Ingresa al menos una URL de video', 'error');
                return;
            }
            
            // Validar URLs
            for (const url of urls) {
                try {
                    new URL(url);
                } catch (e) {
                    showMessage(`URL inválida: ${url}`, 'error');
                    return;
                }
            }
            
            // Registrar videos
            submitBtn.disabled = true;
            submitBtn.textContent = `Registrando 0/${urls.length}...`;
            
            let successCount = 0;
            let errorCount = 0;
            
            for (let i = 0; i < urls.length; i++) {
                const url = urls[i];
                const title = titles[i] || `Video ${i + 1}`;
                
                try {
                    const response = await fetch(`${API_BASE}/videos/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            videoUrl: url,
                            usuario: username,
                            titulo: title
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        successCount++;
                        console.log(`✅ Video registrado: ${title}`);
                    } else {
                        errorCount++;
                        console.error(`❌ Error registrando ${title}:`, data.error);
                    }
                } catch (error) {
                    errorCount++;
                    console.error(`❌ Error registrando ${title}:`, error);
                }
                
                submitBtn.textContent = `Registrando ${i + 1}/${urls.length}...`;
            }
            
            // Mostrar resultado
            submitBtn.disabled = false;
            submitBtn.textContent = 'Registrar Videos';
            
            if (successCount > 0) {
                showMessage(`✅ ${successCount} video(s) registrado(s) correctamente. ${errorCount > 0 ? `⚠️ ${errorCount} error(s)` : ''}`, 'success');
                document.getElementById('video-urls').value = '';
                document.getElementById('video-titles').value = '';
            } else {
                showMessage(`❌ Error al registrar los videos. ${errorCount > 0 ? `⚠️ ${errorCount} error(s)` : ''}`, 'error');
            }
        });
        
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.classList.remove('hidden');
            
            setTimeout(() => {
                messageEl.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
